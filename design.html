<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working Design Presentation</title>

    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            color: #333;
            background-color: #fafafa;
        }

        h2 {
            color: #4a1525;
            border-bottom: 2px solid #4a1525;
            padding-bottom: 5px;
        }

        .slide-container {
            position: relative;
            width: 100%;
            height: 0;
            padding-bottom: 56.25%;
            overflow: hidden;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .slide-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>

<body>

    <h2>Working Design Presentation</h2>

    <div class="slide-container">
        <iframe 
            src="https://docs.google.com/presentation/d/e/2PACX-1vQ7_jKNKWRSVUX0K6qx1WPy72snRJhKq2Dk0dV0IYBrgaseanmbv_qfKlVvsWNVVz5FdGpAcUowHGKI/pubembed?start=false&loop=false&delayms=3000"
            allowfullscreen="true"
            mozallowfullscreen="true"
            webkitallowfullscreen="true">
        </iframe>
    </div>

</body>
</html>
