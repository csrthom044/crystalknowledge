<style>
  /* --- MERLOT THEME WIDTH EXPANSION OVERRIDES --- */
  .shell {
    max-width: 740px !important;
    width: 90% !important;
    position: relative;
  }

  .shell header, 
  .shell section, 
  #main_content {
    width: 100% !important;
    box-sizing: border-box;
  }
  
  header {
    background: none !important; /* Wipes out the misaligned background image */
    display: block !important; /* RESTORES THE NATIVE HEADER THAT WAS HIDDEN */
    width: 100% !important;
    max-width: 740px !important; 
    margin: 0 auto !important;
    float: none !important;
    position: relative !important;
  }

  /* Keeps the theme header at its proper dimension so assets align perfectly */
  header, 
  .shell header {
    width: 100% !important;
    max-width: 740px !important; 
    margin: 0 auto !important;
    float: none !important;
    position: relative !important;
    display: block !important;
  }

  /* Force the main ribbon block and blue shield to remain perfectly centered */
  .ribbon-outer {
    margin: 0 auto !important;
    float: none !important;
    position: relative;
    display: block;
    width: max-content;
    min-width: 600px;
  }

  /* Hide the broken, unscalable side tails and background fix slices */
  .left-tail, 
  .right-tail, 
  .banner-fix,
  header::before,
  body::before {
    display: none !important;
  }

  /* --- ABSOLUTE ELEMENT REMOVAL OVERRIDES --- */
  /* Aggressively forces the default footer and built-in text to hide */
  footer, .site-footer, .contextual-info, #header_meta {
    display: none !important;
  }

  /* Hides the default corner ribbon completely */
  a[href*="github.com"], 
  [id*="fork"], 
  .github-fork-ribbon {
    display: none !important;
    opacity: 0 !important;
    visibility: hidden !important;
  }

  /* --- FIX COMPACT LAYOUT CONFLICTS --- */
  /* --- MERLOT NAVIGATION BANNER --- */
  .custom-navigation-container {
    margin: -10px auto 20px auto; /* Tucks the nav bar up slightly into the banner shadow */
    padding: 12px 24px;
    background-color: #4a1525; 
    border-radius: 6px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.15);
    display: flex;
    justify-content: center;
    align-items: center;
    max-width: 100%;
    box-sizing: border-box;
    position: relative;
    z-index: 10;
  }

  .custom-navigation-container nav {
    color: #fdf6e2; /* Cream/off-white text matching the header */
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .custom-navigation-container nav strong {
    color: #fdf6e2 !important;
    margin-right: 5px;
  }

  .custom-navigation-container nav a {
    color: #fdf6e2 !important;
    text-decoration: none;
    padding: 0 4px;
    transition: opacity 0.2s ease;
  }
  
  .custom-navigation-container nav a:hover {
    text-decoration: underline !important;
    opacity: 0.9;
  }

  /* Color matching the divider line from the layout image */
  .nav-divider {
    color: #8c5366;
    font-weight: normal;
    user-select: none;
  }
  
  .custom-navigation-container nav a.active {
    color: #ffffff !important;
    text-decoration: underline !important;
    opacity: 1;
  }
</style>

<!-- NATIVE MERLOT BANNER MARKUP -->
<header>
  <div class="ribbon-outer">
    <div class="ribbon-inner">
      <h1>Knowledge Is Power</h1>
      <h2>Team Crystal</h2>
    </div>
    <div class="shield"></div>
  </div>
</header>

<!-- Custom Header Segment Wrapper -->
<div class="custom-navigation-container">
    <nav>
        <strong>Project Navigation:</strong>
        <a href="home.html" target="content-frame" class="active">Home</a>
        <span class="nav-divider">|</span>
        <a href="bios.html" target="content-frame">Bios</a>
        <span class="nav-divider">|</span>
        <a href="labs.html" target="content-frame">Labs</a>
        <span class="nav-divider">|</span>
        <a href="presentations.html" target="content-frame">Presentation</a>
    </nav>
</div>

<!-- Interactive Document Frame Container -->
<div style="margin: 30px 0 20px 0; text-align: center;">
    <iframe 
        src="home.html" 
        name="content-frame"
        title="KIP Project Content Frame"
        width="100%" 
        height="600" 
        style="border: 3px solid #4a1525; border-radius: 6px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); background-color: #ffffff;">
    </iframe>
</div>

<!-- ACTIVE SCRIPT PLACEMENT -->
<script>
  document.querySelectorAll('.custom-navigation-container nav a').forEach(link => {
    link.addEventListener('click', function() {
      document.querySelectorAll('.custom-navigation-container nav a').forEach(item => {
        item.classList.remove('active');
      });
      this.classList.add('active');
    });
  });
</script>
